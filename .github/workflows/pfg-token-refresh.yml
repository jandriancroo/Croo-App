name: PFG Token Refresh + PA Catalog Sync

on:
  schedule:
    # Run every 20 hours (cycles through different times)
    - cron: '0 */20 * * *'
  workflow_dispatch: # Allow manual trigger for testing
    inputs:
      skip_pfg:
        description: 'Skip PFG token refresh'
        required: false
        default: 'false'
      skip_pa:
        description: 'Skip PA catalog sync'
        required: false
        default: 'false'

jobs:
  refresh-pfg-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.skip_pfg != 'true' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      
      - name: Run PFG Login Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node .github/scripts/pfg-headless-login.mjs

  sync-pa-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.inputs.skip_pa != 'true' }}
    
    steps:
      - name: Sync PA Catalog via Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🍅 Syncing PA catalog via edge function (no browser needed)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/produce-alliance-service" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -d '{"action":"scrape_all_catalogs"}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status: $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ PA catalog sync failed with status $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ PA catalog sync complete"
