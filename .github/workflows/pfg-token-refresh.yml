name: PFG Token Refresh (headless login)

# PFG B2C sign-ins give a refresh-token chain that hard-expires ~24h after
# login. This job starts a fresh chain per store; run it every 6h so one late
# or failed run can't let the chain lapse.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      skip_pfg:
        description: 'Skip PFG token refresh'
        required: false
        default: 'false'
      skip_pa:
        description: 'Unused (PA catalog job removed; kept so old dispatch calls still work)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  refresh-pfg-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.skip_pfg != 'true' }}
    permissions:
      contents: read

    steps:
      # Only check out the login script, never the app (its package.json pulls
      # in heavy deps like onnxruntime-node whose install broke this job).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Playwright (isolated)
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/pfg-login"
          cp .github/scripts/pfg-headless-login.mjs "$RUNNER_TEMP/pfg-login/"
          cd "$RUNNER_TEMP/pfg-login"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.65.1
          npx playwright install chromium

      - name: Run PFG Login Script
        id: login
        working-directory: ${{ runner.temp }}/pfg-login
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node pfg-headless-login.mjs

      # A broken run (e.g. install failure before any login) reports itself so
      # the chain break is visible before the 24h tokens lapse. Carries only the
      # failed step name and the run URL.
      - name: Report failed run
        if: ${{ failure() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FAILED_STEP: ${{ steps.install.outcome == 'failure' && 'Install Playwright (isolated)' || steps.login.outcome == 'failure' && 'Run PFG Login Script' || 'setup' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Active PFG integrations (location IDs only; not secret).
          PFG_LOCATION_IDS: >-
            12c977c7-1786-4131-90f5-1eef3f96e2c6
            01a87b8b-fb29-4734-8d1b-4a47307f843c
            d667741f-6d4c-433e-bb22-307e817ea7f1
            6eda7b4b-dab1-435c-89b3-38a7a5ac0a3e
            32379593-8255-427b-8ebf-96502f69ca8f
            037bcf8d-84ef-4c3e-b4e1-a1d9ae65bc3b
            2d309714-f808-4c98-b612-10909e569fac
        run: |
          for loc in $PFG_LOCATION_IDS; do
            body=$(jq -nc --arg l "$loc" --arg e "GitHub Actions PFG login run failed at step: $FAILED_STEP. Run: $RUN_URL" '{locationId:$l, error:$e}')
            curl -sS -o /dev/null -w "headless_login_failed $loc -> %{http_code}\n" \
              -X POST "$SUPABASE_URL/functions/v1/pfg-service?action=headless_login_failed" \
              -H "Content-Type: application/json" \
              -H @- <<HDR --data "$body" || true
          Authorization: Bearer $SUPABASE_ANON_KEY
          x-cron-secret: $CRON_SECRET
          HDR
          done
