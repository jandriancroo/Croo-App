# Toast live scrape (homemade integration)
#
# Signs into Toast Web once per run, then polls Sales Summary + punches + wages
# every ~90 s. Three back-to-back runs (≤5h20m each) cover Coop's full day
# (11 AM–10 PM America/Chicago, both CDT and CST). Concurrency queues the next
# run until the previous one exits, so there is only ever ONE Toast sign-in.
# Each run self-terminates once all Toast stores are outside their open window.
name: Toast live scrape

on:
  schedule:
    - cron: "45 15 * * *"   # 10:45 AM CDT / 9:45 AM CST
    - cron: "55 20 * * *"   # handoff ~4 PM Chicago
    - cron: "5 2 * * *"     # handoff ~9 PM Chicago, runs through close
  workflow_dispatch:
    inputs:
      oneshot:
        description: "Single poll then exit (test)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: toast-live-scrape
  cancel-in-progress: false

jobs:
  toast-live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser + runner
        run: |
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      # Reuse the last saved Toast sign-in so each run skips password + 2FA.
      - name: Restore saved Toast sign-in
        uses: actions/cache/restore@v4
        with:
          path: .toast-session.json
          key: toast-session-${{ github.run_id }}
          restore-keys: toast-session-

      - name: Run Toast live robot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TOAST_LOGIN_EMAIL: ${{ secrets.TOAST_LOGIN_EMAIL }}
          TOAST_LOGIN_PASSWORD: ${{ secrets.TOAST_LOGIN_PASSWORD }}
          TOAST_TOTP_SECRET: ${{ secrets.TOAST_TOTP_SECRET }}
          POLL_SECONDS: "90"
          MAX_RUN_MINUTES: "320"
          TOAST_STATE_FILE: ${{ github.workspace }}/.toast-session.json
          ONESHOT: ${{ github.event.inputs.oneshot == 'true' && '1' || '' }}
        run: xvfb-run -a node .github/scripts/toast-live-runner.mjs

      - name: Save Toast sign-in for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .toast-session.json
          key: toast-session-${{ github.run_id }}
