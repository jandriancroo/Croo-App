<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" id="theme-color-meta" content="#417f8e" />
    <meta name="apple-touch-icon" content="/icon-192x192.png">
    <meta name="apple-mobile-web-app-title" content="CrooHQ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>CrooHQ - Built for operators, by operators</title>
    <meta
      name="description"
      content="All-in-one platform for restaurant scheduling, time tracking, task management, and team communication. Built for operators, by operators."
    />
    <meta name="author" content="Lovable" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload critical LCP asset (Croo logo on Auth page) -->
    <link rel="preload" href="/src/assets/croo-logo.webp" as="image" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Critical fonts (Inter & Manrope) loaded first for faster FCP/LCP -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" /></noscript>
    <!-- Decorative font (Pacifico) loaded async -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

    <meta property="og:title" content="CrooHQ - Built for operators, by operators" />
    <meta property="og:description" content="All-in-one platform for restaurant scheduling, time tracking, task management, and team communication." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Catch stale chunk failures after deploys change chunk hashes.
      // Force-reload once to fetch fresh assets. Guard prevents infinite loops.
      (function() {
        var key = 'main_chunk_reload';
        var maxRetries = 2;
        function isChunkError(msg) {
          return msg && (
            msg.indexOf('module script failed') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1
          );
        }
        function tryReload() {
          var count = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (count < maxRetries) {
            sessionStorage.setItem(key, String(count + 1));
            window.location.reload();
          }
        }
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'SCRIPT' && e.target.type === 'module') {
            tryReload();
            return;
          }
          var msg = (e.message || '') + ' ' + ((e.error && e.error.message) || '');
          if (isChunkError(msg)) tryReload();
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e.reason && (e.reason.message || String(e.reason))) || '';
          if (isChunkError(msg)) tryReload();
        });
        // Clear counter after app renders successfully (delayed to ensure JS modules loaded)
        setTimeout(function() {
          if (document.getElementById('root') && document.getElementById('root').children.length > 0) {
            sessionStorage.removeItem(key);
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
