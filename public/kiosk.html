<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiosk" />
    <meta name="theme-color" content="#3D2B1F" />
    <link rel="manifest" href="/kiosk-manifest.json" />
    <link rel="apple-touch-icon" href="/kiosk-icon.png" />
    <link rel="icon" href="/kiosk-icon.png" type="image/png" />
    <title>CrooHQ Kiosk</title>
  </head>
  <body style="margin:0;font-family:-apple-system,system-ui,sans-serif;background:#3D2B1F;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;">
    <div>
      <p style="font-size:18px;margin:0 0 8px;">Redirecting to Kiosk…</p>
      <p style="font-size:13px;opacity:0.7;margin:0;">If adding to Home Screen, tap <b>Share → Add to Home Screen</b> now.</p>
    </div>
    <script>
      // Give iOS a moment to parse the manifest before redirecting
      setTimeout(function() { window.location.replace('/kiosk'); }, 800);
    </script>
  </body>
</html>
